<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="stylesheet" href="../css/responsivos.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Sora:wght@100..800&display=swap');
    </style>
    <link rel="icon" href="../img/logo.png">
</head>
<body style="background: #f4f2f1;">
    <main id="logcad">
        <div class="container">
            <h1>Cadastro Bibliosesi</h1>
            <div class="cadastro">
                <form id="formCadastro">
                    <!--Nome do aluno----------------------->
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome." required />

                    <!--Email do aluno----------------------->
                    <label for="email">E-mail Educacional:</label>
                    <input type="email" id="email" placeholder="Digite seu email educacional." required />

                    <!--Senha----------------------->
                    <label for="senha">Senha:</label>
                    <input id="senha" type="password" placeholder="Digite sua senha." required />

                    <!--RM----------------------->
                    <label for="rm">RM:</label>
                    <input id="rm" type="text" placeholder="Registro do aluno." required />

                    <!--FUNÇÃO----------------------->
                    <label for="funcao">Tipo de conta:</label>
                    <select name="funcao" id="funcao">
                        <option label="Selecione o tipo de conta"></option>
                        <option value="ADM">Administrador</option>
                        <option value="ALUNO">Aluno</option>
                    </select>
                    <div class="button">
                        <button class="login" type="submit" id="bt-cadastrar">Cadastrar</button>
                    </div>
                </form>
                <p>Já é cadastrado? Faça <a href="login.htm">login</a></p>
            </div>
        </div>
    </main>
</body>
<script src="../login.js"></script>

</html>
