<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="../css/responsivos.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Sora:wght@100..800&display=swap');
    </style>
    <link rel="icon" href="../img/logo.png">
</head>

<body>
    <header>
        <div class="ordena">
            <img src="../img/logo.png" alt="bibliosesi logo">
            <h1>Biblioteca Virtual</h1>
            <i class="fa-solid fa-bars bt-menu"></i>
        </div>
    </header>
    <div class="overlay" id="overlay"></div>
    <div class="navegar">
        <nav>
            <ul>
                <div class="nav-links">
                    <i class="fa-solid fa-house"></i>
                    <li><a href="inicial.htm">Início</li></a>
                </div>
                <div class="nav-links">
                    <i class="fa-solid fa-circle-user"></i>
                    <li><a href="perfil.htm">Perfil do Usuáro</li></a>
                </div>
                <div class="nav-links">
                    <i class="fa-solid fa-folder-open"></i>
                    <li><a href="emprestimos.htm">Empréstimos</li></a>
                </div>
                <div class="nav-links">
                    <i class="fa-solid fa-book"></i>
                    <li><a href="catalogo.htm">Catálogo</li></a>
                </div>
                <div class="nav-links" id="link-administracao" style="display:none;">
                    <i class="fa-solid fa-user-shield"></i>
                    <li><a href="admin.htm">Administração</a></li>
                </div>
                <div class="bt-sair">
                    <button onclick="logoff()">Sair <i class="fa-solid fa-right-to-bracket"></i></button>
                </div>
            </ul>
        </nav>
    </div>

    <main class="perfil">
        <div class="aluno">
            <div class="aluno-infos">
                <div class="left">
                    <img src="../img/profile_placeholder.png" alt="foto de perfil" id="foto-perfil">
                    <button onclick="mudarFoto()"><i class="fa-solid fa-pen"></i>Editar foto</button>
                </div>
                <div class="right">
                    <h3 id="nome"></h3>
                    <p id="rm"></p>
                    <p id="email"></p>
                </div>
            </div>
            <span class="divisor"></span>
            <div class="aluno-estat">
                <div class="estatisticas">

                    <div class="stats">
                        <h3>Livros favoritados</h3>
                        <span>
                            <i class="fa-solid fa-heart"></i>
                            <span id="favoritos-count">0</span>
                        </span>
                    </div>

                    <div class="stats">
                        <h3>Livros emprestados</h3>
                        <span><i class="fa-solid fa-book"></i><span id="emprestados-count">0</span></span>
                    </div>
                    <div class="stats">
                        <h3>Livros em posse</h3>
                        <span><i class="fa-solid fa-hand"></i><span id="posse-count">0</span></span>
                    </div>
                </div>
            </div>
        </div>
        <span class="hr"></span>
        <div class="aluno-det perfil-listas">
            <section class="lista-espera perfil-bloco">
                <h2>Histórico de empréstimos</h2>
                <div id="historico-emprestimos" class="avisos"><p>Carregando...</p></div>
            </section>
            <section class="lista-espera perfil-bloco">
                <h2>Livros em posse</h2>
                <div id="livros-em-posse" class="avisos"><p>Carregando...</p></div>
            </section>
            <section class="lista-espera perfil-bloco">
                <h2>Livros favoritados</h2>
                <div id="livros-favoritos" class="avisos"><p>Carregando...</p></div>
            </section>
            <section class="aluno-avisos perfil-bloco">
                <div class="title">
                    <img src="../img/warning.png" alt="Avisos" height="30" width="30">
                    <h2>Avisos</h2>
                </div>
                <div class="avisos"><ul id="lista-avisos"><li>Carregando...</li></ul></div>
            </section>
        </div>
    </main>

    <div class="mudar-foto">
        <form action="" class="formfoto" onsubmit="salvarFoto(); return false;">
            <label for="foto">Selecione um arquivo png, jpg ou webp...</label>
            <input type="file" id="foto">
            <div class="form-btn">
                <button type="button" onclick="salvarFoto()">Salvar</button>
                <button onclick="cancelar()">Cancelar</button>
            </div>
        </form>
    </div>

</body>
<script src="../perfil.js"></script>
<script src="../script.js"></script>

</html>
